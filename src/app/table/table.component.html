<div class="h-screen flex-col flex content-between" >
<div *ngIf="loading$|async" class="w-full text-sky-800 flex text-center">Loading...</div>
  <div *ngIf="!isLandscape" class="overflow-y-auto flex-1 w-full pb-12 md:pb-0" (appOverscroll)="fun($event)">
    <table *ngIf="((players$|async)?.length) ?? 0 >= 4" class="table-auto w-full">
      <thead class="table-headder-goup shadow-lg sticky top-0 bg-slate-800 text-sky-600">
        <tr class="table-row">
          <th class="w-2 pt-6 table-coll">Runde</th>
          <th class="table-coll" *ngFor="let player of players$|async; let i = index"  >
            <p [style]="color(i)">
            {{ player.name }}
            </p>
          </th>
        </tr>
        <tr class="text-center bg-slate-700 pt-2">
          <td>∑</td>
          <td *ngFor="let s of players$|async; let j = index" class="text-xl p-1">
            <p
              [ngClass]="{
                'text-sky-300': ((sum$|async)?.at(-1)?.at(j) ?? 0) >= 0,
                'text-red-500': ((sum$|async)?.at(-1)?.at(j) ?? 0) < 0
              }"
            >
              {{ (sum$|async)?.at(-1)?.at(j) ?? 0 }}
            </p>
          </td>
        </tr>
      </thead>
      <tbody >
        <tr
          *ngFor="let game of (table$|async)?.slice()?.reverse()  ?? [] ; let i = index"
          class="text-center            "
          [ngClass]="{ 'bg-slate-950': i % 2 == 1, 'bg-black': i % 2 != 1 }"
        >
          <td class="bg-slate-900 text-sky-800">{{ ((games$|async)?.length ?? 0) - i }}</td>
          <td *ngFor="let value of game">
            <p
              [ngClass]="{
                'text-sky-800': value > 0,
                'text-red-800': value < 0,
                hidden: value == 0
              }"
            >
              {{ value }}
            </p>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <footer *ngIf="(games$|async)?.length ?? 0 > 1" class="w-full flex-row self-end" [ngClass]="{
    'h-1/3': !isLandscape,
    'h-full': isLandscape,
    }">
  <app-graph [isLandscape]=isLandscape
  ></app-graph>
</footer>
</div>
