<div #myElement class="h-screen flex-col flex content-between">
  <div *ngIf="!isLandscape" class="w-full flex justify-between mb-1 text-sky-400">
    <button class="py-2 px-3 active:text-sky-50" (click)="navigate('players')">
      Spieler
    </button>
    <button
      *ngIf="players.length >= 4"
      class="pb-2 px-5 text-xl active:text-sky-50"
      (click)="navigate('game')"
    >
      +
    </button>
  </div>
  <div *ngIf="!isLandscape" class="overflow-y-auto flex-1 w-full pb-12 md:pb-0">
    <table *ngIf="players.length >= 4" class="table-auto w-full">
      <thead class="table-headder-goup shadow-lg sticky top-0 bg-slate-800 text-sky-600">
        <tr class="table-row">
          <th class="w-2 pt-6 table-coll">Runde</th>
          <th class="table-coll" *ngFor="let player of players; let i = index"  >
            <p [style]="color(i)">
            {{ player.name }}
            </p>
          </th>
        </tr>
        <tr class="text-center bg-slate-700 pt-2">
          <td>∑</td>
          <td *ngFor="let s of sum[sum.length - 1]" class="text-xl p-1">
            <p
              [ngClass]="{
                'text-sky-300': s >= 0,
                'text-red-500': s < 0
              }"
            >
              {{ s }}
            </p>
          </td>
        </tr>
      </thead>
      <tbody class="">
        <tr
          *ngFor="let game of table; let i = index"
          class="text-center"
          [ngClass]="{ 'bg-slate-950': i % 2 == 1, 'bg-black': i % 2 != 1 }"
        >
          <td class="bg-slate-900 text-sky-800">{{ table.length - i }}</td>
          <td *ngFor="let player of table[table.length - i - 1]">
            <p
              [ngClass]="{
                'text-sky-800': player > 0,
                'text-red-800': player < 0,
                hidden: player == 0
              }"
            >
              {{ player }}
            </p>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <footer *ngIf="table.length > 1" class="w-full flex-row self-end" [ngClass]="{
    'h-1/3': !isLandscape,
    'h-full': isLandscape,
    }">
  <app-graph
    [tableCost]="table"
    [tableSum]="sum"
    [players]="players"
    [isLandscape]="isLandscape"
  ></app-graph>
</footer>
</div>
